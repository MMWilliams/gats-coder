[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-agent"
version = "0.8.5"
description = "LEDGER - GATS-planned, audit-first autonomous coding agent: the LLM writes the code, deterministic search decides what happens next, sensors verify every claim, and every run replays bit-exact."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maureese Williams", email = "maureesewilliams@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools.packages.find]
include = ["ledger*"]

